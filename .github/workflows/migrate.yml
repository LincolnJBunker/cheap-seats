# Manual only: apply database migrations with the owner role.
name: migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    uses: ./.github/workflows/_run-job.yml
    with:
      command: alembic upgrade head
    secrets:
      FT_MIGRATION_DATABASE_URL: ${{ secrets.FT_MIGRATION_DATABASE_URL }}
