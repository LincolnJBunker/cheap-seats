# Reusable workflow: runs one tracker command against the production database.
# Called by scan.yml, verify.yml, digest.yml, maintain.yml and migrate.yml.
name: run-job

on:
  workflow_call:
    inputs:
      command:
        description: "Command to run, e.g. 'ft scan' (fixed strings from the caller workflows)"
        required: true
        type: string
    secrets:
      FT_DATABASE_URL:
        required: false
      FT_MIGRATION_DATABASE_URL:
        required: false
      FT_TRAVELPAYOUTS_TOKEN:
        required: false
      FT_SERPAPI_KEY:
        required: false
      FT_RESEND_API_KEY:
        required: false

permissions:
  contents: read

# One queue per command: a job never overlaps another copy of itself. Different jobs may run at
# the same time; that's safe because the SerpApi budget is enforced atomically in the database
# (fn_consume_quota). A single shared queue was wrong: GitHub keeps only ONE pending run per
# group, so a newly queued job silently cancelled a different job that was waiting.
concurrency:
  group: flight-tracker-${{ inputs.command }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked, no dev dependencies)
        run: uv sync --frozen --no-dev

      - name: Run
        env:
          # The command is passed via env (not inlined into the script) to avoid template injection.
          FT_COMMAND: ${{ inputs.command }}
          FT_DATABASE_URL: ${{ secrets.FT_DATABASE_URL }}
          FT_MIGRATION_DATABASE_URL: ${{ secrets.FT_MIGRATION_DATABASE_URL }}
          FT_TRAVELPAYOUTS_TOKEN: ${{ secrets.FT_TRAVELPAYOUTS_TOKEN }}
          FT_SERPAPI_KEY: ${{ secrets.FT_SERPAPI_KEY }}
          FT_RESEND_API_KEY: ${{ secrets.FT_RESEND_API_KEY }}
        # Word splitting of $FT_COMMAND is intended ("ft scan" -> ft, scan).
        run: uv run $FT_COMMAND
